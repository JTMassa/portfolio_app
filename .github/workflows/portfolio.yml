name: Build, Scan, and Deploy Portfolio App
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker image
        run: docker build -t portfolio-app .

      - name: Scan Docker image for vulnerabilities   
        uses: aquasecurity/trivy-action@master
        with:
            image-ref: portfolio-app:latest
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build Docker image
        run: |
         docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio-app:$GITHUB_RUN_NUMBER .
         docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio-app .
      - name: Push Docker image
        run: |
         docker push ${{ secrets.DOCKER_USERNAME }}/portfolio-app:$GITHUB_RUN_NUMBER
         docker push ${{ secrets.DOCKER_USERNAME }}/portfolio-app

  deploy:
      needs: Build
      runs-on: ubuntu-latest
      steps:
        - name: SSH to Linux and run containers 
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.USERNAME }}
            key: ${{ secrets.KEY }}
            script: |
                docker rm -f portfolio || echo "Container not found, skipping removal"
                docker run -d -p 8080:85 --name portfolio ${{ secrets.DOCKER_USERNAME }}/portfolio-app:latest